# SkyTree 大规模压测示例配置。

server:
  port: 9526

broker:
  listeners:
    - "tcp://0.0.0.0:1883"
    - "tcp://0.0.0.0:1884"
    - "tcp://0.0.0.0:1885"
    - "ws://0.0.0.0:8083"
  keep_alive_seconds: 300
  read_batch_size: 1000
  persist_qos0: false
  client_rate:
    enabled: true
    messages_per_second: 100
    window_size: 5
  connack:
    topic_alias_maximum: 100
    server_keep_alive: 300
  message_retry:
    interval: "10s"
    max_timeout: "60s"
    scheduler_interval: "100ms"

storage:
  driver: badger
  message_expire_days: 24
  delivery_queue:
    driver: scylla
  payload:
    driver: scylla
  badger:
    path: "./data/badger-stress"
  cassandra:
    hosts: ["127.0.0.1"]
    port: 9042
    keyspace: "skytree"
    auto_create_table: true

cluster:
  enable: true
  join: false
  data_dir: "./data/raft-stress"
  local_node_address: "127.0.0.1:8080"
  local_node_id: 1
  write_timeout: "10s"
  member:
    1: "127.0.0.1:8080"
    2: "127.0.0.1:8081"
    3: "127.0.0.1:8082"
    4: "127.0.0.1:8083"
    5: "127.0.0.1:8084"
  grpc:
    addr: "0.0.0.0:8091"
    endpoint: "127.0.0.1:8091"
    allow_insecure: true
  health_check:
    enabled: true
    interval: "10s"
    timeout: "3s"
    max_retries: 5

delivery:
  inflight_wait_tick: "2s"

logging:
  level: "warn"
  file: "./logs/skyTree-stress.log"
  max_size: 500
  max_age: 7
  max_backups: 5
