# SkyTree cluster 示例配置。
# 这是一个开发/测试集群示例，不是 beta 安全基线模板。

server:
  port: 9526

broker:
  listeners:
    - tcp://0.0.0.0:1883
  no_sub_topic_behavior: 0

storage:
  driver: badger
  delivery_queue:
    driver: scylla
  payload:
    driver: scylla
  badger:
    path: "./data/badger-cluster"
  cassandra:
    hosts: ["127.0.0.1"]
    port: 9042
    keyspace: "skytree"
    auto_create_table: true

cluster:
  enable: true
  join: false
  data_dir: "./data/raft-cluster"
  local_node_address: "127.0.0.1:8080"
  local_node_id: 1
  write_timeout: "5s"
  member:
    1: "127.0.0.1:8080"
    2: "127.0.0.1:8081"
    3: "127.0.0.1:8082"
  grpc:
    addr: "127.0.0.1:8091"
    endpoint: "127.0.0.1:8091"
    allow_insecure: true
  health_check:
    enabled: true
    interval: "30s"
    timeout: "5s"
    max_retries: 3
