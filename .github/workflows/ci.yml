name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate config files
        run: make test-configs

      - name: Run short tests
        run: make test-short

      - name: Run race tests (core packages)
        run: make test-race-core

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skytree:test .
