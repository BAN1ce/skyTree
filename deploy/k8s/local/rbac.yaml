apiVersion: v1
kind: ServiceAccount
metadata:
  name: skytree-console
  namespace: skytree-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skytree-console-pod-reader
  namespace: skytree-local
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skytree-console-pod-reader
  namespace: skytree-local
subjects:
  - kind: ServiceAccount
    name: skytree-console
    namespace: skytree-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skytree-console-pod-reader
