apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skytree
  namespace: default
  labels:
    app: skytree
spec:
  serviceName: skytree-headless
  replicas: 3
  selector:
    matchLabels:
      app: skytree
  template:
    metadata:
      labels:
        app: skytree
    spec:
      containers:
      - name: skytree
        image: skytree:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1883
          name: mqtt-tcp
          protocol: TCP
        - containerPort: 8080
          name: mqtt-ws
          protocol: TCP
        - containerPort: 8081
          name: mqtt-wss
          protocol: TCP
        - containerPort: 9526
          name: http-api
          protocol: TCP
        - containerPort: 8091
          name: grpc
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: data-volume
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 9526
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9526
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: skytree-config
      - name: data-volume
        emptyDir: {}
      securityContext:
        fsGroup: 1001
