apiVersion: v1
kind: ConfigMap
metadata:
  name: skytree-config
  namespace: skytree-beta
data:
  config.yaml: |
    console:
      enabled: false

    broker:
      listeners:
        - tcp://0.0.0.0:1883
        - tls://0.0.0.0:8883
      tls:
        enabled: true
        cert_file: /etc/skytree/tls/broker/tls.crt
        key_file: /etc/skytree/tls/broker/tls.key
        ca_file: /etc/skytree/tls/broker/ca.crt
        reload_interval: 5m
        mtls_auth_mode: optional

    storage:
      driver: badger
      delivery_queue:
        driver: scylla
      payload:
        driver: scylla
      badger:
        path: /app/data/badger
      cassandra:
        hosts: ["scylla.skytree-beta.svc.cluster.local"]
        port: 9042
        keyspace: skytree
        consistency: LOCAL_QUORUM
        timeout: 3s
        connect_timeout: 3s
        num_conns: 8
        auto_create_table: false

    server:
      port: 9526
      tls:
        enabled: true
        cert_file: /etc/skytree/tls/api/tls.crt
        key_file: /etc/skytree/tls/api/tls.key
        reload_interval: 5m

    cluster:
      enable: true
      join: false
      data_dir: /app/data/raft
      local_node_address: "${NODE_NAME}:8080"
      local_node_id: 1
      write_timeout: 5s
      member:
        1: "skytree-0.skytree-headless.skytree-beta.svc.cluster.local:8080"
        2: "skytree-1.skytree-headless.skytree-beta.svc.cluster.local:8080"
        3: "skytree-2.skytree-headless.skytree-beta.svc.cluster.local:8080"
      grpc:
        addr: 0.0.0.0:8091
        endpoint: "${NODE_NAME}:8091"
        allow_insecure: false
        tls:
          enabled: true
          cert_file: /etc/skytree/tls/grpc/tls.crt
          key_file: /etc/skytree/tls/grpc/tls.key
          ca_file: /etc/skytree/tls/grpc/ca.crt
          reload_interval: 5m
          mtls_auth_mode: required
