apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skytree
  namespace: skytree-beta
spec:
  serviceName: skytree-headless
  replicas: 3
  selector:
    matchLabels:
      app: skytree
  template:
    metadata:
      labels:
        app: skytree
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: skytree
          image: skytree:beta
          imagePullPolicy: IfNotPresent
          env:
            - name: SKYTREE_K8S_AUTO_NODE_ID
              value: "true"
            - name: SKYTREE_K8S_HEADLESS_SERVICE
              value: skytree-headless
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtts
              containerPort: 8883
            - name: raft
              containerPort: 8080
            - name: http
              containerPort: 9526
            - name: grpc
              containerPort: 8091
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: broker-tls
              mountPath: /etc/skytree/tls/broker
              readOnly: true
            - name: api-tls
              mountPath: /etc/skytree/tls/api
              readOnly: true
            - name: grpc-tls
              mountPath: /etc/skytree/tls/grpc
              readOnly: true
            - name: acl-rules
              mountPath: /etc/skytree/acl
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
      volumes:
        - name: config
          configMap:
            name: skytree-config
        - name: broker-tls
          secret:
            secretName: skytree-broker-tls
        - name: api-tls
          secret:
            secretName: skytree-api-tls
        - name: grpc-tls
          secret:
            secretName: skytree-grpc-tls
        - name: acl-rules
          secret:
            secretName: skytree-acl-rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
